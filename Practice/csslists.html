<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>csslists</title>
    <style>
        nav ul li{
            list-style:lower-greek;
            list-style-position: inside;
            background-color: brown;
            border: 2px solid pink;
            padding: 10px;
            
            
            
        }
        nav ul{
            display: flex;
            
        }

    </style>
</head>
<body>
    <nav>
        <ul>
            <li>home</li>
            <li>hi</li>
            <li>bye</li>
        </ul>
    </nav>
    
</body>
</html>
