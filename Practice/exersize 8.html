<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exersize 8</title>
    <style>
        *{
            padding: 0;margin: 0;
        }
        .container{
            background-color: blue;
            width: 100vw;
            height: 60vh;
            position: absolute;
            

        }
        .ball{
            background-color: red;
            border: 2px solid red;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            left: 0;
            height: 100px;
            width: 100px;
            animation: bounceyup 0.5s ease-out infinite alternate ;
            
            
        }

        @keyframes bounceyup {
    0% {
        bottom: 0;
        left: 0;
        animation-timing-function: ease-out; /* Slows down as it goes up */
    }
    50% {
        /* This is the peak of the arc */
        bottom: 250px; 
        left: 250px;
        animation-timing-function: ease-in; /* Speeds up as it falls */
    }
    100% {
        /* Back to the floor, but further to the right */
        bottom: 0;
        left: 500px;
    }
}


    </style>
</head>
<body>
    <div class="container">
        <div class="ball"></div>
    </div>
    
</body>
</html>
