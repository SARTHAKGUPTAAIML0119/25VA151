<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows</title>
    <style>
        .box{
        width:200px;
        height:200px;
        padding:0px;
        background-color:blue;
        margin:0px;
        box-shadow:10px 10px 0px black;
        text-shadow: 10px 10px 2px red;
        color: blue;


        
    }
    </style>
</head>
<body>
    <div class="box">
        i am a box
    </div>
    
</body>
</html>
